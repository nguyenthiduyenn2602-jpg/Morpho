<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Morpho热线 · 私人收件箱</title>
<style>[hidden]{display:none!important}body{margin:0;background:#faf7f0;color:#423831;font:16px/1.7 system-ui}main{max-width:850px;margin:auto;padding:24px}h1{font-family:serif}button,input{font:inherit;padding:10px;border:1px solid #c9b9ad;border-radius:8px}button{cursor:pointer;background:#914939;color:white}input{max-width:90%}article{padding:24px;background:white;border:1px solid #d8c9ba;border-radius:14px;margin:18px 0}p{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:100%;max-height:480px;display:block;margin:12px 0}small{color:#756657}#notice{color:#914939}nav{display:flex;gap:12px}a{color:#914939}</style>
<main><small>MORPHO / 管理员收件箱</small><h1>Morpho热线 · 私人收件箱</h1><p>仅保存主动提交的文字。第一版仅接收文字投稿。</p><form id="login"><label>管理员口令 <input id="password" type="password" required autocomplete="current-password"></label> <button>登录收件箱</button></form><nav id="tools" hidden><button id="refresh">刷新来信</button><button id="previous">上一页</button><button id="next">下一页</button><button id="logout">退出登录</button></nav><p id="notice" role="status"></p><section id="letters"></section></main>
<script>
let offset=0;const $=id=>document.getElementById(id);async function api(url,options){const r=await fetch(url,options);if(r.status===401){$('login').hidden=false;$('tools').hidden=true;$('letters').replaceChildren();}const b=await r.json();if(!r.ok)throw Error(b.error);return b;}
function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n;}
async function load(){try{const rows=await api('/api/admin/letters?offset='+offset);$('login').hidden=true;$('tools').hidden=false;$('letters').replaceChildren();$('notice').textContent=`第 ${offset/30+1} 页 · 本页 ${rows.length} 封来信 · ${rows.filter(x=>!x.read).length} 封未读`;$('previous').disabled=offset===0;$('next').disabled=rows.length<30;for(const r of rows){const a=el('article','');a.append(el('small',`${r.read?'已读':'未读'} · ${new Date(r.created).toLocaleString()} · ${r.id}`),el('h2',r.title),el('p',`${r.age} 岁 · ${r.gender} · ${r.occupation}`),el('p',r.story));if(r.question)a.append(el('h3','想问的问题'),el('p',r.question));a.append(el('p',r.email?`回信邮箱：${r.email}`:'未留下回信邮箱'));if(!r.read){const b=el('button','标记已读');b.onclick=async()=>{try{await api(`/api/admin/letters/${r.id}/read`,{method:'POST'});await load();}catch(e){$('notice').textContent=e.message;}};a.append(b);}$('letters').append(a);}}catch(e){$('notice').textContent=e.message;}}
$('login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('password').value='';await load();}catch(e){$('notice').textContent=e.message;}};
$('previous').onclick=()=>{offset=Math.max(0,offset-30);load();};$('next').onclick=()=>{offset+=30;load();};$('refresh').onclick=()=>{offset=0;load();};$('logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'});$('letters').replaceChildren();$('login').hidden=false;$('tools').hidden=true;$('notice').textContent='已退出';}catch(e){$('notice').textContent=e.message;}};load();
</script></html>
